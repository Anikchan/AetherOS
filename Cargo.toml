[workspace]
resolver = "2"
# P0-T05 skeleton: one crate per planned system component.
# P4 (S3) adds `ui/` (shared design system) and the default app crates under
# `apps/`. `apps/pkg`, `apps/store`, `apps/sandbox` and `apps/runner` belong to
# the P6 app platform (session S4) and join the workspace when that work starts.
members = [
    "compositor",
    "shell",
    "ui",
    "lifecycled",
    "powerd",
    "config",
    "installer",
    "update",
    "apps/text",
    "apps/calculator",
    "apps/files",
    "apps/images",
    "apps/documents",
    "apps/media",
    "apps/player",
    "apps/terminal",
    "apps/calendar",
    "apps/archive",
    "apps/browser",
    "apps/taskmanager",
    "apps/pkg",
    "apps/sandbox",
    "apps/runner",
    "apps/store",
    "apps/storage-analyzer",
    "apps/launcher-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# P4: one pinned Slint version for the shell, the design system and every app.
# Default features are deliberately narrow: software rendering + std only, so
# the whole workspace builds and tests headlessly on the macOS dev host and on
# the Linux CI runner. The interactive window backend is opt-in (`winit`
# feature per crate) and the on-device layer-shell platform lands with P3-T02.
#
# Window-backend scoping (P3 window host, 2026-11-28): the app crates opt in to
# `backend-winit` + `backend-winit-wayland` in their own manifests, because
# `slint` features are additive per build unit. The shell and `ui` keep this
# narrow set: the shell paints its layer surfaces through its own
# `wayland-client` host and its tests install `i-slint-backend-testing`.
# Build the shell on its own (`cargo build -p aether-shell`) to keep winit out
# of the shell binary; a `--workspace` build unifies features and links it.
# Evidence and risks: docs/2026/11/28/results/app-window-backend.md.
[workspace.dependencies]
slint = { version = "1.19.0", default-features = false, features = [
    "compat-1-18",
    "renderer-software",
    "software-renderer-systemfonts",
    "std",
] }
slint-build = "1.19.0"
aether-ui = { path = "ui" }

[profile.release]
lto = true
strip = true
