# P1-T05: UEFI disk image layout (ESP + read-only squashfs root).
# The ESP vfat image is pre-built by post-image.sh (genimage's mcopy
# can't find mtools on the runner's PATH).
image aetheros-efi.img {
	hdimage {
		partition-table-type = gpt
	}

	partition boot {
		partition-type-uuid = U
		bootable = true
		image = "efi-part.vfat"
	}

	partition root {
		partition-type-uuid = L
		# Fixed PARTUUID so the kernel can find root on any device name
		# (vda in QEMU/virtio, sda on bare-metal USB). Keep in sync with
		# the grub.cfg root=PARTUUID= value.
		partition-uuid = "9f8e7d6c-1a2b-4c3d-8e4f-5a6b7c8d9e0f"
		image = "rootfs.squashfs"
	}
}
