# /var is tmpfs on AetherOS (read-only squashfs root), so a directory baked into
# the image would be hidden at runtime. systemd-tmpfiles-setup runs before
# multi-user.target, which is early enough for a unit's StandardOutput= setup.
#
# Without this, `StandardOutput=append:/var/log/aether/compositor.log` failed
# with "Failed to set up standard output: No such file or directory" and the
# graphical session never started (2026-11-28, 3 restarts then start-limit).
d /var/log/aether 0755 root root -
