[package]
name = "aether-shell"
description = "AetherOS desktop shell: menu bar, dock, launcher, control centre, notifications, lock screen, overview and settings (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-shell"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint.workspace = true
aether-ui.workspace = true
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
