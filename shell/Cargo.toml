[package]
name = "aether-shell"
description = "AetherOS desktop shell: menu bar, dock, launcher, control centre, notifications, lock screen, overview and settings (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-shell"
path = "src/main.rs"

[[bin]]
name = "aether-greeter"
path = "src/bin/aether-greeter.rs"

[features]
default = []
# Linux-PAM binding for the in-session lock screen. Off by default because the
# macOS development host has no libpam; `cargo check --features pam` still
# type-checks the FFI there and Linux images build with `--features pam`.
pam = []

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint.workspace = true
aether-ui.workspace = true
aether-config = { path = "../config" }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# P3-T02: the layer-shell host. The pure-Rust `wayland-client` backend needs no
# libwayland, so the host builds on the macOS dev host as well as the image.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
