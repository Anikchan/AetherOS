name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Check budgets (P0-T11)
        run: python3 os-build/check-budgets.py os-build/metrics/sample.txt
      # P0-T11 (budgets file) and later gates plug in here.
