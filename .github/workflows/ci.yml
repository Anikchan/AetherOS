name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # libxkbcommon: compositor. fontconfig/freetype: Slint system fonts
        # (`software-renderer-systemfonts`, used by aether-ui/shell/apps).
        # fonts-dejavu-core: deterministic text for any future render job —
        # the current tests are headless and assert structure, not pixels.
        # libegl1 + mesa software stack: XWayland (P3-T03) probes EGL/glamor at
        # startup and aborts if libEGL.so.1 is missing; with no GPU it needs the
        # Mesa software driver to fall back cleanly to SHM rendering.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev pkg-config fonts-dejavu-core \
            libegl1 libegl-mesa0 libgl1-mesa-dri \
            xwayland x11-apps

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --workspace

      # Linux parity (2026-11-27): the same suite was green on the macOS dev
      # host and red on this runner — a Landlock test that assumed rule order, a
      # compositor test that assumed client 0 (XWayland is a client too), a
      # powerd fixture that read the runner's AC adapter, and a seccomp arch
      # check that killed every syscall. Two things follow:
      #   1. run every target, not just the default set (`--all-targets`);
      #   2. publish a summary that names the failing tests, because a red job
      #      with a 3000-line log costs an evening to attribute.
      - name: Test (workspace, all targets — Linux parity)
        run: |
          # --all-targets excludes doctests, which the old `cargo test --workspace`
          # did run, so both passes are kept.
          rc=0
          cargo test --workspace --all-targets 2>&1 | tee /tmp/cargo-test.log || rc=$?
          cargo test --workspace --doc 2>&1 | tee -a /tmp/cargo-test.log || rc=$?
          exit $rc

      - name: Test summary (Linux parity)
        # Runs even when the suite fails: the summary is the evidence. Failing
        # tests are annotated (`::error`) and listed with their captured output.
        if: always()
        run: bash os-build/scripts/check-test-summary.sh /tmp/cargo-test.log --annotations >> "$GITHUB_STEP_SUMMARY"

      - name: Defconfig drop guard (silent kconfig drops)
        # BR2_PACKAGE_WIREPLUMBER=y was silently dropped for lack of Lua, and
        # the image shipped without a PipeWire session manager. The guard proves
        # itself here; the real defconfig/.config pair is checked by the
        # buildroot-build job, which actually runs `make defconfig`.
        run: bash os-build/scripts/check-defconfig-drop.sh --self-test

      - name: Image capability contract (self-test, then static scan)
        # The image has no `pgrep` and no `script`. A check that says "X is not
        # running" because the tool is missing is a lie, so the tool list is a
        # contract (os-build/test/capabilities.expected) and scripts are scanned
        # against it.
        run: |
          bash -n os-build/test/capabilities.sh
          bash os-build/test/capabilities.sh --self-test
          bash os-build/scripts/check-image-capabilities.sh --self-test
          bash os-build/scripts/check-image-capabilities.sh --strict

      - name: Kernel feature probe (Landlock / seccomp)
        # If the sandbox tests skip, this says why: the tests gate on the kernel
        # actually having the ABI, and a silent skip is indistinguishable from a
        # pass in the log.
        run: |
          cargo run -q -p aether-sandbox --bin aether-landlock -- --probe --json | tee /tmp/landlock-probe.json || true
          uname -r
          grep -E '^(Seccomp|NoNewPrivs):' /proc/self/status || true

      - name: Host-gated tests announce their skips
        # The kernel-dependent tests print "skipped: …" through eprintln!, which
        # cargo swallows unless the test fails. --nocapture forces the sentence
        # into the log and into the summary, so "the sandbox tests are green"
        # can never quietly mean "the sandbox tests never ran".
        run: |
          set +e
          cargo test -p aether-sandbox --test landlock_enforce --test seccomp_enforce -- --nocapture 2>&1 | tee /tmp/host-gated.log
          rc=${PIPESTATUS[0]}
          {
            echo "## Host-gated suites (Landlock / seccomp)"
            echo '```'
            grep -E "skipped" /tmp/host-gated.log || echo "no skips: every assertion in these suites ran on this kernel"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Compositor smoke test (P3-T01)
        run: |
          cargo build -p aether-compositor
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          ./target/debug/aether-compositor > /tmp/comp.log 2>&1 &
          COMP_PID=$!
          for _ in $(seq 1 100); do grep -q AETHER_COMPOSITOR_SOCKET_READY /tmp/comp.log && break; sleep 0.2; done
          grep -q AETHER_COMPOSITOR_SOCKET_READY /tmp/comp.log || { echo "FAIL: compositor did not start"; cat /tmp/comp.log; exit 1; }
          # Build and run spike-client against the compositor
          cd spikes && cargo build --release -p spike-client && cd ..
          WAYLAND_DISPLAY=wayland-0 timeout 30 ./spikes/target/release/spike-client 2>&1 | tee /tmp/client.log
          grep -q CLIENT_WINDOW_MAPPED /tmp/client.log || { echo "FAIL: client did not map"; exit 1; }
          grep -q AETHER_COMPOSITOR_CLIENT_MAPPED /tmp/comp.log || { echo "FAIL: compositor did not detect mapped surface"; exit 1; }
          wait $COMP_PID 2>/dev/null || true
          echo "Compositor smoke test: PASS"

      - name: Check budgets (P0-T11)
        run: python3 os-build/check-budgets.py os-build/metrics/sample.txt

      - name: S4 harness and contract checks
        # Hardware-independent guards: gate-report self-test, the Activity
        # Manager energy/service/Pack D contracts, the shipped RAUC A/B config,
        # and the live-USB/bundle script syntax.
        run: |
          python3 lifecycled/bench/gate-report.py --self-test
          cargo run -q -p aether-taskmanager -- --energy-contract > /dev/null
          cargo run -q -p aether-taskmanager -- --shortcut | grep -q open-activity-manager
          cargo run -q -p aether-taskmanager -- --tab performance | grep -q "Performance (60 s window)"
          # TM-17: a service action plans behind the permission prompt and never runs.
          cargo run -q -p aether-taskmanager -- --service-actions | grep -q admin.authorize
          cargo run -q -p aether-taskmanager -- --service-action aether-powerd.service restart | grep -q SERVICE_ACTION_PLAN_OK
          # ... and the printed plan names the D-Bus call the executor would make.
          cargo run -q -p aether-taskmanager -- --service-action aether-powerd.service restart | grep -q "busctl call org.freedesktop.systemd1"
          ! cargo run -q -p aether-taskmanager -- --service-action aether-lifecycled.service stop > /dev/null 2>&1
          # The shipped polkit policy is generated from the contract.
          cargo run -q -p aether-taskmanager -- --polkit-policy \
            | diff -u apps/taskmanager/polkit/org.aether.taskmanager.service-action.policy -
          # Pack D data contracts (per-app network, per-process GPU).
          cargo run -q -p aether-taskmanager -- --pack-d-contract | grep -q "aether-net-accounting v1"
          cargo run -q -p aether-taskmanager -- --pack-d-contract | grep -q "aether-lifecycled samples DRM fdinfo"
          cargo run -q -p aether-sandbox --bin aether-sandbox -- doctor | grep -q '"seccomp"'
          cargo run -q -p aether-sandbox --bin aether-sandbox -- seccomp | grep -q SECCOMP_PLAN_OK
          cargo run -q -p aether-sandbox --bin aether-sandbox -- doctor | grep -q landlock_status
          # Fail-closed Landlock shim: either an ABI or an explicit refusal.
          (cargo run -q -p aether-sandbox --bin aether-landlock -- --probe || true) | grep -qE "LANDLOCK_(ABI|UNAVAILABLE)"
          (cargo run -q -p aether-sandbox --bin aether-landlock -- --probe --json || true) | grep -q '"seccomp"'
          cargo run -q -p aether-update -- rauc-config | grep -q RAUC_CONFIG_OK
          bash -n os-build/scripts/make-live-usb.sh
          bash -n os-build/scripts/rauc-bundle.sh
          echo "S4 harness checks: PASS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: |
            target/debug/deps/*.d
          if-no-files-found: ignore
          retention-days: 7