name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # libxkbcommon: compositor. fontconfig/freetype: Slint system fonts
        # (`software-renderer-systemfonts`, used by aether-ui/shell/apps).
        # fonts-dejavu-core: deterministic text for any future render job —
        # the current tests are headless and assert structure, not pixels.
        # libegl1 + mesa software stack: XWayland (P3-T03) probes EGL/glamor at
        # startup and aborts if libEGL.so.1 is missing; with no GPU it needs the
        # Mesa software driver to fall back cleanly to SHM rendering.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev pkg-config fonts-dejavu-core \
            libegl1 libegl-mesa0 libgl1-mesa-dri \
            xwayland x11-apps

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-${{ runner.os }}-

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Compositor smoke test (P3-T01)
        run: |
          cargo build -p aether-compositor
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          ./target/debug/aether-compositor > /tmp/comp.log 2>&1 &
          COMP_PID=$!
          for _ in $(seq 1 100); do grep -q AETHER_COMPOSITOR_SOCKET_READY /tmp/comp.log && break; sleep 0.2; done
          grep -q AETHER_COMPOSITOR_SOCKET_READY /tmp/comp.log || { echo "FAIL: compositor did not start"; cat /tmp/comp.log; exit 1; }
          # Build and run spike-client against the compositor
          cd spikes && cargo build --release -p spike-client && cd ..
          WAYLAND_DISPLAY=wayland-0 timeout 30 ./spikes/target/release/spike-client 2>&1 | tee /tmp/client.log
          grep -q CLIENT_WINDOW_MAPPED /tmp/client.log || { echo "FAIL: client did not map"; exit 1; }
          grep -q AETHER_COMPOSITOR_CLIENT_MAPPED /tmp/comp.log || { echo "FAIL: compositor did not detect mapped surface"; exit 1; }
          wait $COMP_PID 2>/dev/null || true
          echo "Compositor smoke test: PASS"

      - name: Check budgets (P0-T11)
        run: python3 os-build/check-budgets.py os-build/metrics/sample.txt

      - name: S4 harness and contract checks
        # Hardware-independent guards: gate-report self-test, the Activity
        # Manager energy-column contract, the shipped RAUC A/B config, and the
        # live-USB/bundle script syntax.
        run: |
          python3 lifecycled/bench/gate-report.py --self-test
          cargo run -q -p aether-taskmanager -- --energy-contract > /dev/null
          cargo run -q -p aether-update -- rauc-config | grep -q RAUC_CONFIG_OK
          bash -n os-build/scripts/make-live-usb.sh
          bash -n os-build/scripts/rauc-bundle.sh
          echo "S4 harness checks: PASS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: |
            target/debug/deps/*.d
          if-no-files-found: ignore
          retention-days: 7