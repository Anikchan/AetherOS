name: buildroot-build

# P1-T01/P1-T06: full Buildroot build on a Linux runner; reports the base
# image size against the P1 budget (<= 150 MB compressed).
#
# Two jobs on purpose:
#   config  — ~5 min: defconfig + the silent-drop guard + the UI wiring guard.
#             This is the fast feedback loop; a defconfig mistake used to cost
#             a two-hour build before it was visible.
#   build   — the image itself, with the Buildroot output cached between runs
#             so an unchanged tree only re-runs target-finalize and the image
#             assembly (minutes), not the whole toolchain and package set.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "os-build/buildroot/**"
      - "os-build/kernel/**"
      - "os-build/board/**"
      - "os-build/post-build.sh"
      - "os-build/scripts/check-defconfig-drop.sh"
      - "os-build/scripts/check-ui-image.sh"
      - ".github/workflows/buildroot-build.yml"

jobs:
  config:
    # Fast gate: no compilation. Catches the class of defect that made three
    # consecutive image builds fail before compiling anything (silent kconfig
    # drops, a defconfig entry that no longer resolves).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install kconfig dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev rsync wget file bc git
      - name: Clone Buildroot (pinned)
        run: git clone --depth 1 --branch 2025.11 https://gitlab.com/buildroot.org/buildroot.git os-build/buildroot/buildroot
      - name: Configure (defconfig only)
        run: |
          cd os-build/buildroot/buildroot
          make BR2_DEFCONFIG=../aetheros_defconfig defconfig
      - name: Defconfig drop guard — every requested symbol must survive
        # WirePlumber teaches the lesson: BR2_PACKAGE_WIREPLUMBER=y needs a Lua
        # >= 5.3 provider, and with none kconfig deletes the symbol outright —
        # no warning, no '# ... is not set', and an image without a PipeWire
        # session manager. This compares the defconfig's intent with the
        # generated .config and fails on anything that vanished.
        run: |
          bash os-build/scripts/check-defconfig-drop.sh \
            os-build/buildroot/buildroot/.config \
            os-build/buildroot/aetheros_defconfig
      - name: UI wiring guard against the generated config
        run: |
          bash os-build/scripts/check-ui-image.sh --config os-build/buildroot/buildroot/.config
      - name: Capability contract (static scan)
        run: |
          bash os-build/scripts/check-image-capabilities.sh --strict
      - name: Publish the resolved config
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-config
          path: os-build/buildroot/buildroot/.config
          retention-days: 7

  build:
    needs: config
    # host-m4 (gnulib) fails to compile on the runner's newest gcc (C23
    # _Generic conflict); 22.04 has a compatible toolchain.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev rsync wget file bc git libelf-dev mtools \
            qemu-system-x86 expect ovmf grub-pc-bin grub-efi-amd64-bin grub-common parted squashfs-tools
      - name: Clone Buildroot (pinned)
        run: git clone --depth 1 --branch 2025.11 https://gitlab.com/buildroot.org/buildroot.git os-build/buildroot/buildroot
      - name: Compute cache key
        # sha256 of every build input; a change re-keys the cache, and the
        # restore-keys prefix still reuses the previous tree for an incremental
        # build. Computed in the shell because `hashFiles` failed this step with
        # "Fail to hash files under directory" (2026-11-28).
        id: cachekey
        run: |
          {
            sha256sum os-build/buildroot/aetheros_defconfig \
                      os-build/kernel/aether.fragment \
                      os-build/post-build.sh 2>/dev/null
            find os-build/board -type f -print0 2>/dev/null | sort -z | xargs -0 sha256sum 2>/dev/null
          } | sha256sum | cut -c1-16 | sed 's/^/key=buildroot-output-/' >> "$GITHUB_OUTPUT"
      - name: Restore Buildroot output cache
        # Reuses the previous build's output/ so only changed packages rebuild.
        # A cold cache simply means a full build, as before.
        uses: actions/cache/restore@v4
        with:
          path: |
            os-build/buildroot/buildroot/output
            os-build/.cache/dl
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            buildroot-output-
      - name: Configure
        run: |
          cd os-build/buildroot/buildroot
          make BR2_DEFCONFIG=../aetheros_defconfig defconfig
          # Sanity check: required kernel options resolve.
          make linux-menuconfig >/dev/null 2>&1 || true
          grep -q "^CONFIG_PSI=y" output/build/linux-*/.config 2>/dev/null || \
            echo "WARN: CONFIG_PSI not confirmed yet (checked again after build)"
      - name: Defconfig drop guard — every requested symbol must survive
        run: |
          # Buildroot 2025.11 writes the generated config at <tree>/.config
          # (not <tree>/output/.config); the script also falls back to the
          # other layout so a future change cannot make the guard pass by
          # absence.
          bash os-build/scripts/check-defconfig-drop.sh \
            os-build/buildroot/buildroot/.config \
            os-build/buildroot/aetheros_defconfig
      - name: Build
        id: build
        timeout-minutes: 90
        run: |
          cd os-build/buildroot/buildroot
          make -j"$(nproc)"
      - name: Save Buildroot output cache
        # Saved immediately after the build, because the boot tests below free
        # disk by deleting output/build and output/host — saving at job end
        # would store a cache that misses exactly the expensive parts.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            os-build/buildroot/buildroot/output
            os-build/.cache/dl
          key: ${{ steps.cachekey.outputs.key }}
      - name: Image capability contract — assert the tool list (P2 lesson)
        # The image has no `pgrep` and no `script`; the acceptance harness assumed
        # both. Unpack the rootfs (no boot needed) and diff it against
        # os-build/test/capabilities.expected. The full probe is published so the
        # manifest can be corrected from evidence, not memory.
        run: |
          ROOT=/tmp/aether-rootfs
          rm -rf "$ROOT"
          unsquashfs -no-progress -d "$ROOT" \
            os-build/buildroot/buildroot/output/images/rootfs.squashfs > /dev/null
          # Evidence first: these artifacts are what the manifest gets corrected
          # from when the assertion below fails.
          bash os-build/test/capabilities.sh --root "$ROOT" > capabilities-actual.txt
          bash os-build/test/capabilities.sh --root "$ROOT" --json > capabilities-actual.json
          bash os-build/test/capabilities.sh --root "$ROOT" --applets > capabilities-applets.txt
          {
            echo "## AetherOS image capabilities"
            echo '```'
            cat capabilities-actual.txt
            echo '```'
            echo "### busybox applets ($(wc -l < capabilities-applets.txt))"
            echo '```'
            tr '\n' ' ' < capabilities-applets.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # …then the assertion. A missing required tool fails the job, and the
          # artifacts above say exactly which tools the image really has.
          bash os-build/test/capabilities.sh --root "$ROOT" --check os-build/test/capabilities.expected
      - name: Report image sizes and check budgets (P1-T06)
        run: |
          cd os-build/buildroot/buildroot/output/images
          ls -lh
          SIZE_KB="$(du -k rootfs.squashfs | cut -f1)"
          echo "base_image_compressed_mb = $(awk "BEGIN{print int($SIZE_KB/1024)}")" > metrics.txt
          cat metrics.txt
          python3 "$GITHUB_WORKSPACE/os-build/check-budgets.py" metrics.txt || true
          # Hard gate: P1-T06 base image <= 150 MB compressed.
          [ "$SIZE_KB" -le 153600 ] || { echo "FAIL: base image over 150 MB"; exit 1; }
      - name: Boot test — login, mounts, DHCP (P1-T02/T03/T04)
        timeout-minutes: 20
        run: |
          # Free disk space: boot tests only need output/images/
          rm -rf os-build/buildroot/buildroot/output/build \
                 os-build/buildroot/buildroot/output/host
          export KERNEL=os-build/buildroot/buildroot/output/images/bzImage
          export ROOTFS=os-build/buildroot/buildroot/output/images/rootfs.squashfs
          export TRANSCRIPT=$(mktemp)
          expect os-build/test/ci-boot.exp | tee boot-test.log
          grep -q 'S_BOOT_LOGIN_OK' boot-test.log || { echo "FAIL: no login prompt"; exit 1; }
          grep -q 'S_MOUNTS_OK' boot-test.log || { echo "FAIL: /var,/home not on tmpfs"; exit 1; }
          grep -q 'S_DHCP_OK' boot-test.log || { echo "FAIL: no DHCP lease"; exit 1; }
      - name: BIOS boot test — GRUB2 MBR (P1-T07)
        timeout-minutes: 20
        run: |
          chmod +x os-build/board/aetheros/make-bios-image.sh
          sudo os-build/board/aetheros/make-bios-image.sh \
            os-build/buildroot/buildroot/output/images os-build/board/aetheros
          export DISK=os-build/buildroot/buildroot/output/images/aetheros-bios.img
          export TRANSCRIPT=$(mktemp)
          expect os-build/test/ci-boot-bios.exp | tee boot-bios.log
          grep -q 'S_BIOS_BOOT_OK' boot-bios.log || { echo "FAIL: BIOS boot chain failed"; exit 1; }
      - name: UEFI boot test — GRUB2 (x86_64-efi) (P1-T05)
        timeout-minutes: 15
        run: |
          export DISK=os-build/buildroot/buildroot/output/images/aetheros-efi.img
          test -f "$DISK" || { echo "FAIL: UEFI disk image missing"; exit 1; }
          # Debug: list ESP contents
          echo "=== ESP contents ==="
          mdir -i os-build/buildroot/buildroot/output/images/efi-part.vfat :: 2>/dev/null || echo "mdir failed"
          echo "=== boot/grub/grub.cfg ==="
          mtype -i os-build/buildroot/buildroot/output/images/efi-part.vfat ::/boot/grub/grub.cfg 2>/dev/null || echo "mtype failed"
          echo "=== EFI/BOOT ==="
          mdir -i os-build/buildroot/buildroot/output/images/efi-part.vfat ::/EFI/BOOT 2>/dev/null || echo "mdir failed"
          export OVMF=/usr/share/OVMF/OVMF_CODE.fd
          cp /usr/share/OVMF/OVMF_VARS.fd ./OVMF_VARS.fd
          export OVMF_VARS=$PWD/OVMF_VARS.fd
          export TRANSCRIPT=$(mktemp)
          expect os-build/test/ci-boot-uefi.exp | tee boot-uefi.log
          grep -q 'S_UEFI_BOOT_OK' boot-uefi.log || { echo "FAIL: UEFI boot chain failed"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aetheros-images
          path: |
            os-build/buildroot/buildroot/output/images/
            boot-test.log
            boot-uefi.log
            boot-bios.log
            capabilities-actual.txt
            capabilities-actual.json
            capabilities-applets.txt
          retention-days: 7
