name: artifact-cleanup

# Periodic cleanup of old workflow artifacts to keep storage usage low.
# Runs daily; can also be triggered manually.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      retention-days:
        description: "Delete artifacts older than this many days"
        required: false
        default: "14"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete artifacts older than retention window
        uses: actions/github-script@v7
        with:
          script: |
            const days = parseInt('${{ github.event.inputs.retention-days || '14' }}', 10);
            const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
            const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            for (const a of artifacts.artifacts || []) {
              if (new Date(a.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                deleted++;
                core.info(`deleted: ${a.name} (${a.created_at})`);
              }
            }
            core.summary.addRaw(`Deleted ${deleted} artifacts older than ${days} days.`);
            await core.summary.write();