<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">AetherOS notification center concept</title>
  <desc id="description">A quiet notification center with a Focus schedule and grouped, dismissible cards.</desc>
  <defs>
