      <rect x="1042" y="592" width="312" height="104" rx="13" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".19"/>
      <rect x="1058" y="609" width="28" height="28" rx="8" fill="#78aaf0"/><text x="1072" y="628" text-anchor="middle" fill="#fff" font-size="15">⚙</text>
      <text x="1096" y="619" fill="#f1f4f7" font-size="13" font-weight="600">System</text><text x="1338" y="619" text-anchor="end" fill="#aebbc8" font-size="10">9:14 AM</text>
