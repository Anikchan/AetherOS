    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#202d3b" stop-opacity=".96"/><stop offset="1" stop-color="#121b27" stop-opacity=".97"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="22"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <path d="M0 560 222 365l194 172 215-215 206 223 214-167 214 204 175-136v454H0Z" fill="#345560"/>
  <path d="M0 713q257-144 477-9t432-27q260-117 531-7v230H0Z" fill="#172f3b"/>
  <rect width="1440" height="900" fill="#08111d" opacity=".24"/>
