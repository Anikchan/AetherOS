<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">AetherOS desktop concept</title>
  <desc id="description">A calm desktop with a translucent menu bar, file browser window, status card, and centered application dock.</desc>
  <defs>
    <linearGradient id="sky" x2="0.9" y2="1">
      <stop stop-color="#172b49"/>
      <stop offset=".48" stop-color="#477c9d"/>
      <stop offset="1" stop-color="#d89c80"/>
    </linearGradient>
    <linearGradient id="hill" x2="0" y2="1">
      <stop stop-color="#315d68"/>
      <stop offset="1" stop-color="#172d3a"/>
    </linearGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#263746" stop-opacity=".88"/>
      <stop offset="1" stop-color="#121b27" stop-opacity=".84"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#sky)"/>
