<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">AetherOS installer concept</title>
  <desc id="description">A plain-language dual-boot installer with a clear disk-space preview, safeguards, and a review-before-install step.</desc>
  <defs>
    <linearGradient id="backdrop" x2="1" y2="1"><stop stop-color="#152a43"/><stop offset=".55" stop-color="#355a71"/><stop offset="1" stop-color="#bb866e"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#202d3b"/><stop offset="1" stop-color="#151e29"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="25"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#backdrop)"/>
  <circle cx="1170" cy="175" r="115" fill="#f0bd94" opacity=".54"/>
  <path d="M0 565 240 355l183 174 208-235 222 231 204-163 194 187 189-142v493H0Z" fill="#274553" opacity=".8"/>
  <path d="M0 718q260-140 474-14t433-24q268-113 533-11v231H0Z" fill="#132d39"/>
  <rect width="1440" height="900" fill="#06101b" opacity=".35"/>
  <g filter="url(#shadow)">
    <rect x="300" y="82" width="840" height="736" rx="22" fill="url(#card)" stroke="#fff" stroke-opacity=".42"/>
    <rect x="300" y="82" width="840" height="76" rx="22" fill="#fff" fill-opacity=".04"/>
    <circle cx="340" cy="120" r="15" fill="#4c8dff"/><text x="340" y="125" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="14" font-weight="700">N</text>
    <text x="368" y="116" fill="#f5f7fa" font-family="Inter, sans-serif" font-size="15" font-weight="600">AetherOS Installer</text>
    <text x="368" y="137" fill="#aebbc8" font-family="Inter, sans-serif" font-size="11">Personal Edition · Install alongside Windows</text>
    <g font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
      <circle cx="386" cy="191" r="13" fill="#4c8dff"/><text x="386" y="195" fill="#fff">1</text>
      <circle cx="594" cy="191" r="13" fill="#4c8dff"/><text x="594" y="195" fill="#fff">2</text>
      <circle cx="802" cy="191" r="13" fill="#4c8dff"/><text x="802" y="195" fill="#fff">3</text>
      <circle cx="1010" cy="191" r="13" fill="#fff" fill-opacity=".14"/><text x="1010" y="195" fill="#b5c1cd">4</text>
      <path d="M399 191h182M607 191h182M815 191h182" stroke="#fff" stroke-opacity=".2"/>
      <text x="386" y="219" fill="#dce5ed">Welcome</text><text x="594" y="219" fill="#dce5ed">Choose disk</text>
      <text x="802" y="219" fill="#dce5ed">Review</text><text x="1010" y="219" fill="#9eacb9">Install</text>
    </g>
    <text x="360" y="274" fill="#f6f8fa" font-family="Inter, sans-serif" font-size="24" font-weight="600">Review your installation</text>
    <text x="360" y="302" fill="#b9c6d2" font-family="Inter, sans-serif" font-size="13">Nothing changes until you confirm on the next step.</text>
    <rect x="360" y="330" width="720" height="206" rx="14" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".19"/>
    <text x="384" y="367" fill="#f1f4f7" font-family="Inter, sans-serif" font-size="14" font-weight="600">Disk layout · 512 GB SSD</text>
    <text x="1056" y="367" text-anchor="end" fill="#aebbc8" font-family="Inter, sans-serif" font-size="11">Changes shown as a preview</text>
    <rect x="384" y="389" width="672" height="24" rx="7" fill="#fff" fill-opacity=".12"/>
    <path d="M391 389h425v24H391a7 7 0 0 1-7-7v-10a7 7 0 0 1 7-7Z" fill="#4c8dff"/>
    <path d="M816 389h232a8 8 0 0 1 8 8v8a8 8 0 0 1-8 8H816Z" fill="#6bd29a"/>
    <text x="384" y="446" fill="#eff3f7" font-family="Inter, sans-serif" font-size="12">■  Windows 11</text><text x="384" y="469" fill="#b8c4d0" font-family="Inter, sans-serif" font-size="11">Existing partition · 320 GB · unchanged</text>
    <text x="720" y="446" fill="#eff3f7" font-family="Inter, sans-serif" font-size="12">■  AetherOS</text><text x="720" y="469" fill="#b8c4d0" font-family="Inter, sans-serif" font-size="11">New space · 160 GB</text>
    <text x="384" y="507" fill="#b8c4d0" font-family="Inter, sans-serif" font-size="11">EFI system partition and recovery partitions are preserved.</text>
    <rect x="360" y="556" width="720" height="74" rx="12" fill="#e7ae54" fill-opacity=".12" stroke="#e7ae54" stroke-opacity=".5"/>
    <circle cx="386" cy="582" r="10" fill="#e7ae54"/><text x="386" y="586" text-anchor="middle" fill="#17202a" font-family="Inter, sans-serif" font-size="12" font-weight="700">!</text>
    <text x="408" y="581" fill="#f5e4c5" font-family="Inter, sans-serif" font-size="13" font-weight="600">Before you continue</text>
    <text x="408" y="605" fill="#d7c6a9" font-family="Inter, sans-serif" font-size="11">Back up important files. Keep the computer plugged in and have your BitLocker recovery key ready.</text>
    <rect x="360" y="650" width="720" height="50" rx="10" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/>
    <rect x="378" y="667" width="16" height="16" rx="4" fill="none" stroke="#aebbc8" stroke-width="1.5"/>
    <text x="406" y="680" fill="#d7e0e8" font-family="Inter, sans-serif" font-size="12">I have backed up important files and saved my recovery key.</text>
    <path d="M360 728h720" stroke="#fff" stroke-opacity=".14"/>
    <rect x="360" y="751" width="96" height="38" rx="9" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/>
    <text x="408" y="775" text-anchor="middle" fill="#e7edf3" font-family="Inter, sans-serif" font-size="12">Back</text>
    <text x="870" y="775" text-anchor="end" fill="#9eacb9" font-family="Inter, sans-serif" font-size="11">No changes made yet</text>
    <rect x="916" y="751" width="164" height="38" rx="9" fill="#4c8dff"/>
    <text x="998" y="775" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Continue to install</text>
  </g>
</svg>
