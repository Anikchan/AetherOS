<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">AetherOS control center concept</title>
  <desc id="description">A quick settings panel with network, Bluetooth, Focus, display, sound, brightness, and battery controls.</desc>
