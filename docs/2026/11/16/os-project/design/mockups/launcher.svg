<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">AetherOS launcher concept</title>
  <desc id="description">A centered search-first launcher with keyboard-selected results and a small grid of apps over a dimmed desktop.</desc>
  <defs>
    <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#1b3251"/><stop offset=".55" stop-color="#6387a0"/><stop offset="1" stop-color="#d48b75"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#202d3b" stop-opacity=".96"/><stop offset="1" stop-color="#121b27" stop-opacity=".97"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#wall)"/>
  <path d="M0 570 220 375l180 166 232-234 210 245 192-158 205 198 201-136v444H0Z" fill="#294655"/>
  <path d="M0 698q260-142 470-15t437-24q255-118 533-18v259H0Z" fill="#152e3b"/>
  <g filter="url(#blur)" opacity=".55"><rect x="80" y="90" width="470" height="300" rx="22" fill="#fff"/><rect x="940" y="350" width="390" height="250" rx="22" fill="#192638"/></g>
  <rect width="1440" height="900" fill="#08111d" opacity=".48"/>
  <g filter="url(#shadow)">
    <rect x="400" y="126" width="640" height="648" rx="22" fill="url(#panel)" stroke="#fff" stroke-opacity=".44"/>
    <rect x="432" y="158" width="576" height="52" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".22"/>
    <text x="458" y="191" fill="#d6e0e9" font-family="Inter, sans-serif" font-size="20">⌕</text>
    <text x="490" y="190" fill="#f4f6f9" font-family="Inter, sans-serif" font-size="15">Find apps, files, and settings</text>
    <rect x="964" y="170" width="26" height="26" rx="6" fill="#fff" fill-opacity=".1"/>
    <text x="977" y="188" text-anchor="middle" fill="#bac6d2" font-family="Inter, sans-serif" font-size="12">⌘</text>
    <text x="434" y="251" fill="#aebbc8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SUGGESTED</text>
    <rect x="424" y="269" width="592" height="72" rx="12" fill="#4c8dff" fill-opacity=".25" stroke="#78acff" stroke-opacity=".7"/>
    <rect x="444" y="285" width="40" height="40" rx="11" fill="#7baaf5"/>
    <text x="464" y="312" text-anchor="middle" fill="#fff" font-family="Inter, sans-serif" font-size="20">▧</text>
    <text x="500" y="299" fill="#f6f8fb" font-family="Inter, sans-serif" font-size="14" font-weight="600">Files</text>
    <text x="500" y="320" fill="#c3cfdb" font-family="Inter, sans-serif" font-size="12">Browse your home folder</text>
    <text x="980" y="310" text-anchor="end" fill="#d7e4f2" font-family="Inter, sans-serif" font-size="11">↵ Open</text>
    <g font-family="Inter, sans-serif" font-size="13">
      <text x="448" y="375" fill="#f1f4f7">◉  Web</text><text x="978" y="375" text-anchor="end" fill="#aebbc8" font-size="12">Application</text>
      <path d="M438 393h564" stroke="#fff" stroke-opacity=".1"/>
      <text x="448" y="423" fill="#f1f4f7">▤  Notes</text><text x="978" y="423" text-anchor="end" fill="#aebbc8" font-size="12">Application</text>
      <path d="M438 441h564" stroke="#fff" stroke-opacity=".1"/>
      <text x="448" y="471" fill="#f1f4f7">⚙  Appearance settings</text><text x="978" y="471" text-anchor="end" fill="#aebbc8" font-size="12">Setting</text>
    </g>
    <path d="M432 504h576" stroke="#fff" stroke-opacity=".16"/>
    <text x="434" y="538" fill="#aebbc8" font-family="Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="1">YOUR APPS</text>
    <g font-family="Inter, sans-serif" font-size="11" fill="#edf2f7" text-anchor="middle">
      <g transform="translate(488 602)"><rect x="-26" y="-25" width="52" height="50" rx="14" fill="#78a9f3"/><text y="7" font-size="22">▧</text><text y="47">Files</text></g>
      <g transform="translate(596 602)"><rect x="-26" y="-25" width="52" height="50" rx="14" fill="#cf806d"/><text y="7" font-size="22">◉</text><text y="47">Web</text></g>
      <g transform="translate(704 602)"><rect x="-26" y="-25" width="52" height="50" rx="14" fill="#73c899"/><text y="7" font-size="22">▤</text><text y="47">Notes</text></g>
      <g transform="translate(812 602)"><rect x="-26" y="-25" width="52" height="50" rx="14" fill="#b499eb"/><text y="7" font-size="22">▦</text><text y="47">Apps</text></g>
      <g transform="translate(920 602)"><rect x="-26" y="-25" width="52" height="50" rx="14" fill="#dcb75d"/><text y="7" font-size="22">⚙</text><text y="47">Settings</text></g>
    </g>
    <rect x="432" y="704" width="576" height="1" fill="#fff" opacity=".14"/>
    <text x="720" y="737" text-anchor="middle" fill="#aebbc8" font-family="Inter, sans-serif" font-size="12">↑ ↓ Navigate     ↵ Open     Esc Close</text>
  </g>
</svg>
