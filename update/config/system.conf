# AetherOS RAUC A/B configuration (P9-T01/T02, D4 §6).
# Embedded by update/src/rauc.rs; keep update/config/README.md in sync.

[system]
compatible=aetheros
# GRUB2 writes the boot choice to a grubenv file (post-image.sh, os-build/board).
bootloader=grub
grubenv=/boot/grub/grubenv

[keyring]
# Development CA. Release images use the offline production key (P9-T05).
path=/etc/rauc/ca.cert.pem

# Root A. The slot holds a raw squashfs image, so RAUC writes the bundle image
# directly to the partition.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/aetheros-a
type=raw
bootname=A

# Root B.
[slot.rootfs.1]
device=/dev/disk/by-partlabel/aetheros-b
type=raw
bootname=B
