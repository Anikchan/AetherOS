[package]
name = "aether-calculator"
description = "AetherOS Calculator default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-calculator"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint = { workspace = true, features = ["backend-winit", "backend-winit-wayland"] }
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
