[package]
name = "aether-taskmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AetherOS Activity Manager: process/system metrics, sensors, efficiency mode, export (P5-T07, F13)"

[dependencies]
aether-lifecycled = { path = "../../lifecycled" }
aether-powerd = { path = "../../powerd" }
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { workspace = true, features = ["backend-winit", "backend-winit-wayland"] }
thiserror = "2"

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
