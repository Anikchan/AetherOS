[package]
name = "aether-taskmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AetherOS Activity Manager core: process/system metrics, sensors, efficiency mode, export (P5-T07, F13)"

[dependencies]
aether-lifecycled = { path = "../../lifecycled" }
aether-powerd = { path = "../../powerd" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
