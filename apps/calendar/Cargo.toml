[package]
name = "aether-calendar"
description = "AetherOS Calendar default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-calendar"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint = { workspace = true, features = ["backend-winit", "backend-winit-wayland"] }
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
