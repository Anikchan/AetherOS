[package]
name = "aether-documents"
description = "AetherOS Documents default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-documents"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint.workspace = true
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
# Decoding poppler's rendered PNG pages into a Slint image (P4-T13).
png = "0.18"

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
