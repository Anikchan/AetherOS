[package]
name = "aether-archive"
description = "AetherOS Archive default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-archive"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint.workspace = true
aether-ui.workspace = true
tar = "0.4"
flate2 = "1.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
