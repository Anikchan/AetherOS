[package]
name = "aether-images"
description = "AetherOS Images default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-images"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint = { workspace = true, features = ["backend-winit", "backend-winit-wayland"] }
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
