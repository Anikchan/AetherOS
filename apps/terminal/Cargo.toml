[package]
name = "aether-terminal"
description = "AetherOS Terminal default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-terminal"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint = { workspace = true, features = ["backend-winit", "backend-winit-wayland"] }
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
libc = "0.2"

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
