[package]
name = "aether-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AetherOS app runner: engines, sandboxed launch, Windows prefixes, compatibility DB (P6-T02/T03/T05/T07/T10)"

# Two binaries (`aether-runner`, `aether-samples`); the CLI is the default so
# `cargo run -p aether-runner -- engines package …` works without --bin.
default-run = "aether-runner"

[dependencies]
aether-pkg = { path = "../pkg" }
aether-sandbox = { path = "../sandbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "=1.2.1"
