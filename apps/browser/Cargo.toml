[package]
name = "aether-browser"
description = "AetherOS Browser default app (P4)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aether-browser"
path = "src/main.rs"

[build-dependencies]
slint-build.workspace = true

[dependencies]
slint.workspace = true
aether-ui.workspace = true
aether-launcher-registry = { path = "../launcher-registry" }
aether-media = { path = "../media" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
toml = "1.2"

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
